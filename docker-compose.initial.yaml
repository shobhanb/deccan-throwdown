services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend
    restart: unless-stopped
    expose:
      - "8000"
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./backend/database.db:/app/database.db
      - ./backend/.env:/app/.env:ro
      - ./backend/firebase_service_account_key.json:/app/firebase_service_account_key.json:ro

  nginx:
    image: nginx:1.31.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/www:/usr/share/nginx/html
      - ./nginx/nginx-initial.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
