<ion-app>
  @if (showAdminBanner()) {
  <div class="dt-admin-banner dt-admin-banner-fixed">Admin Mode — Volunteer Tools</div>
  }
  <ion-split-pane
    contentId="main-content"
    [when]="displayMode() ? false : '(min-width: 769px)'"
  >
    @if (!displayMode()) {
    <app-menu></app-menu>
    }
    <ion-router-outlet
      id="main-content"
      [animated]="!displayMode() && pageAnimationsEnabled && !suppressPageAnimationForHistoryNav"
      [swipeGesture]="false"
    ></ion-router-outlet>
  </ion-split-pane>
  @if (!displayMode()) {
  <app-tab-bar></app-tab-bar>
  }
  <app-toast></app-toast>
</ion-app>
