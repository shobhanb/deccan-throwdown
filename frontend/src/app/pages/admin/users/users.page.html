<ion-header>
  <ion-toolbar>
    <ion-menu-button menu="main-menu" slot="start"></ion-menu-button>
    <ion-title>Users</ion-title>
    <app-toolbar-buttons slot="end"></app-toolbar-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-admin-page-header
    title="Admin User Management"
    subtitle="Deccan Throwdown"
  ></app-admin-page-header>

  @if (dataLoaded()) {
  <ion-list [inset]="true" class="dt-admin-list">
    @for (user of allUsers(); track user.uid) {
    <ion-item class="admin-data-row">
      <ion-label>
        <h2><strong>{{ user.display_name }}</strong></h2>
        <p>{{ user.email }}</p>
      </ion-label>

      <div slot="end" class="admin-row-actions">
        @if (user.custom_claims?.admin) {
        <span class="dt-pill dt-pill-gold">Admin</span>
        }
        @if (!user.email_verified) {
        <span class="dt-pill">Not Verified</span>
        }
        <ion-button fill="clear" (click)="presentActionSheet(user)">
          <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
        </ion-button>
      </div>
    </ion-item>
    }
  </ion-list>
  } @else {
  <ion-list [inset]="true" class="dt-admin-list">
    @for (item of [1, 2, 3, 4, 5, 6]; track $index) {
    <ion-item>
      <ion-skeleton-text
        [animated]="true"
        style="width: 100%; height: 48px"
      ></ion-skeleton-text>
    </ion-item>
    }
  </ion-list>
  }
</ion-content>
