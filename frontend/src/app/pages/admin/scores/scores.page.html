<ion-header>
  <ion-toolbar>
    <ion-menu-button menu="main-menu" slot="start"></ion-menu-button>
    <ion-title>Scoring Wods</ion-title>
    <app-toolbar-buttons slot="end"></app-toolbar-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-admin-page-header
    [title]="verificationMode() ? 'Score Verification' : 'Score Keeping'"
    [subtitle]="eventName"
  ></app-admin-page-header>

  @if (dataLoaded()) {
  <ion-list inset="true" class="dt-admin-list">
    @for (wod of wods; track wod.wodNumber) {
    <ion-item [routerLink]="[wod.wodNumber]" routerDirection="forward" class="admin-data-row">
      <div slot="start" class="admin-row-badge">{{ wod.wodNumber }}</div>
      <ion-label>
        <h2>{{ wod.wodName }}</h2>
        <p>{{ wod.wodSummary }}</p>
      </ion-label>
    </ion-item>
    }
  </ion-list>
  } @else {
  <ion-list inset="true" class="dt-admin-list">
    @for (item of [1, 2, 3, 4, 5]; track $index) {
    <ion-item>
      <ion-skeleton-text
        [animated]="true"
        style="width: 100%; height: 48px"
      ></ion-skeleton-text>
    </ion-item>
    }
  </ion-list>
  }
</ion-content>
