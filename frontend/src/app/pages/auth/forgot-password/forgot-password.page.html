<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-container">
    <img src="assets/brand/logo-badge.svg" alt="Deccan Throwdown" class="auth-logo auth-logo-badge" />
    <h1 class="auth-title text-display">Forgot Password</h1>
    <p class="auth-subtitle">Deccan Throwdown</p>
    <p class="auth-description">
      Enter your email address to get a reset password link
    </p>

    <form novalidate (submit)="onSubmit(); $event.preventDefault()">
      <ion-list [inset]="true" class="card-elevated auth-form-card">
        <ion-item>
          <ion-input
            type="email"
            name="email"
            label="Email"
            labelPlacement="stacked"
            placeholder="froning@crossfit.com"
            [formField]="emailForm.email"
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-button
        expand="block"
        color="secondary"
        type="submit"
        [disabled]="!isEmailFormValid()"
        >Send Reset Password Link</ion-button
      >
      <ion-button
        expand="block"
        type="button"
        fill="outline"
        class="auth-cancel-button"
        [routerLink]="['/home']"
        routerDirection="root"
        [replaceUrl]="true"
        >Cancel</ion-button
      >
    </form>
  </div>
</ion-content>
