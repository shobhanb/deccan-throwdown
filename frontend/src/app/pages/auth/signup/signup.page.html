<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-container">
    <img src="assets/brand/logo-badge.svg" alt="Deccan Throwdown" class="auth-logo auth-logo-badge" />
    <h1 class="auth-title text-display">Admin Signup</h1>
    <p class="auth-subtitle">Deccan Throwdown</p>
    <p class="auth-description">
      Talk to your event organizer before signing up as admin
    </p>

    <form (submit)="onSubmitSignupForm(); $event.preventDefault()">
      <ion-list [inset]="true" class="card-elevated auth-form-card">
        <ion-item>
          <ion-input
            type="text"
            label="Name"
            labelPlacement="stacked"
            placeholder="Shubham Hiller"
            [formField]="signupForm.display_name"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            type="email"
            label="Email"
            labelPlacement="stacked"
            placeholder="froning@crossfit.com"
            [formField]="signupForm.email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            type="password"
            label="Password"
            labelPlacement="stacked"
            placeholder="burpees4LYFE"
            minlength="6"
            errorText="Min 6 chars"
            [formField]="signupForm.password"
          >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>
      </ion-list>

      <ion-button
        expand="block"
        color="secondary"
        type="submit"
        [disabled]="!isSignupFormValid()"
        >Sign Up</ion-button
      >

      <ion-button
        expand="block"
        fill="outline"
        class="auth-cancel-button"
        type="button"
        [routerLink]="['/home']"
        routerDirection="root"
        [replaceUrl]="true"
        >Cancel</ion-button
      >
    </form>
  </div>
</ion-content>
