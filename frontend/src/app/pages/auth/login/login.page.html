<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-container">
    <img src="assets/brand/logo-badge.svg" alt="Deccan Throwdown" class="auth-logo auth-logo-badge" />
    <h1 class="auth-title text-display">Login</h1>
    <p class="auth-subtitle">{{ eventName }}</p>
    <p class="auth-description">Login as an admin user</p>

    <form (submit)="onClickLogin(); $event.preventDefault()">
      <ion-list [inset]="true" class="card-elevated auth-form-card">
        <ion-item>
          <ion-input
            type="email"
            label="Email"
            labelPlacement="stacked"
            placeholder="froning@crossfit.com"
            [formField]="loginForm.email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            type="password"
            label="Password"
            labelPlacement="stacked"
            placeholder="burpees4LYFE"
            minlength="6"
            [formField]="loginForm.password"
          >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>
      </ion-list>

      <ion-button
        fill="clear"
        class="auth-link-button"
        type="button"
        routerLink="/auth/forgot-password"
        routerDirection="forward"
      >
        Forgot Password?
      </ion-button>

      <ion-button
        expand="block"
        color="secondary"
        type="submit"
        [disabled]="!isLoginFormValid()"
        >Sign In</ion-button
      >
      <ion-button
        expand="block"
        type="button"
        fill="outline"
        class="auth-cancel-button"
        [routerLink]="['/home']"
        routerDirection="root"
        [replaceUrl]="true"
        >Cancel</ion-button
      >
    </form>
  </div>
</ion-content>
