<ion-header>
  <ion-toolbar>
    <ion-menu-button menu="main-menu" slot="start"></ion-menu-button>
    <ion-title>Image Gallery</ion-title>
    <app-toolbar-buttons slot="end"></app-toolbar-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-page-header title="Image Gallery" subtitle="Event Photos"></app-page-header>

  @if (dataLoaded() && imageData().length === 0) {
  <app-empty-state
    icon="camera-outline"
    message="No photos available yet"
  ></app-empty-state>
  }

  <ion-grid class="gallery-grid">
    <ion-row>
      @for (imageInfo of imageData(); track $index; let i = $index) {
      <ion-col
        size="auto"
        [sizeSm]="imageInfo.type === 'horizontal' ? 'auto' : 6"
        [sizeMd]="imageInfo.type === 'horizontal' ? 'auto' : 4"
        [sizeLg]="imageInfo.type === 'horizontal' ? 'auto' : 3"
        class="image-col"
      >
        <a [href]="imageInfo.path" target="_blank" rel="noopener">
          <ion-img [src]="imageInfo.path" class="gallery-image"></ion-img>
        </a>
      </ion-col>
      }
    </ion-row>

    @if (!dataLoaded()) {
    <ion-row>
      @for (skeleton of [1, 2, 3, 4, 5, 6, 7, 8]; track skeleton) {
      <ion-col size="12" sizeSm="6" sizeMd="4" sizeLg="3">
        <div class="skeleton-image-container">
          <ion-skeleton-text
            [animated]="true"
            class="skeleton-image"
          ></ion-skeleton-text>
        </div>
      </ion-col>
      }
    </ion-row>
    }
  </ion-grid>
</ion-content>
